name: factory-flasher

on:
  pull_request:
    paths:
      - factory_flasher/**
      - scripts/build_factory_flasher.sh
      - .github/workflows/factory-flasher.yml
  push:
    branches: [main]
    paths:
      - factory_flasher/**
      - scripts/build_factory_flasher.sh
      - .github/workflows/factory-flasher.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: factory_flasher/go.sum
      - name: Test and cross-compile
        run: ./scripts/build_factory_flasher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: factory-flasher
          path: factory_flasher/dist/*
          if-no-files-found: error
